# tigomonitord in Docker. Open http://HOST:8080 afterwards, and choose the
# bus source and MQTT broker under Tools.
#
#   docker compose -f linux/docker-compose.yml up -d
services:
  tigomonitord:
    image: ghcr.io/rar/tigomonitord:latest
    # Or build it from this checkout instead of pulling:
    # build: { context: .., dockerfile: linux/Dockerfile }
    container_name: tigomonitord
    # The device ID in Home Assistant comes from the hostname, and Docker's
    # default is the container ID, which changes each time it's recreated.
    hostname: tigomonitor
    # Not on-failure: the web UI's "Restart service" exits cleanly.
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tigomonitor:/var/lib/tigomonitor
      # - /dev:/dev    # a USB RS485 adapter: see device_cgroup_rules below
    # A USB RS485 adapter: uncomment these and the /dev line above. Leave
    # them out when the bus comes from a network bridge (tcp://host:port
    # under Tools). With /dev mounted the container sees the adapter again
    # after a replug, which a devices: entry doesn't; the rules allow USB
    # serial adapters (major 188, ttyUSB) and USB modems (166, ttyACM) and
    # nothing else. Pick the adapter's /dev/serial/by-id name under Tools:
    # it stays the same across reboots and replugs, where /dev/ttyUSB0 may
    # not.
    # device_cgroup_rules:
    #   - "c 188:* rw"
    #   - "c 166:* rw"
    # The CCA page over the host's Bluetooth: BlueZ's D-Bus socket, run as a
    # host account (D-Bus drops user IDs the host can't look up, such as the
    # image's own), in the host's bluetooth group (getent group bluetooth).
    # That account must own the state directory, so bind-mount one it owns
    # in place of the named volume above.
    # user: "1000:1000"
    # group_add:
    #   - "112"
    # volumes:
    #   - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    #   - ./tigomonitor-state:/var/lib/tigomonitor
volumes:
  tigomonitor:
