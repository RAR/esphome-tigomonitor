# .github/workflows/pi.yml
# The Raspberry Pi build (linux/). Every change runs the host tests and the
# end-to-end replay; a manual run or a version tag also builds the .deb and
# the container image, each on a native runner, no QEMU: a tag for arm64 (Pi)
# and amd64 (x86), a manual run for arm64 unless asked for both. A tag pushes
# the image to ghcr.io/rar/tigomonitord.
# (linux/image/build-image.sh can turn the .deb into an SD card image, but we
# only ship the .deb for now.)
name: Pi build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'linux/**'
      # Everything the daemon compiles: any header on its include path, and
      # the bus-master core (linux/CMakeLists.txt). Listing headers one by one
      # missed master_core.cpp, so a change to it ran no tests at all.
      - 'components/tigo_monitor/*.h'
      - 'components/tigo_master/**'
      - 'components/tigo_server/web/app.html'
      - 'components/tigo_server/gzip_splice.h'
      - 'components/tigo_server/web_assets_gen.py'
      - 'tests/host/**'
      - '.github/workflows/pi.yml'
  pull_request:
    paths:
      - 'linux/**'
      # Everything the daemon compiles: any header on its include path, and
      # the bus-master core (linux/CMakeLists.txt). Listing headers one by one
      # missed master_core.cpp, so a change to it ran no tests at all.
      - 'components/tigo_monitor/*.h'
      - 'components/tigo_master/**'
      - 'components/tigo_server/web/app.html'
      - 'components/tigo_server/gzip_splice.h'
      - 'components/tigo_server/web_assets_gen.py'
      - 'tests/host/**'
      - '.github/workflows/pi.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: Architectures to build the .deb and image for
        type: choice
        options: [arm64, both]
        default: arm64
# A newer run of the same kind on the same branch cancels the older one: its
# result no longer matters. Manual builds have their own group, so a merge's
# test run can't cancel a build waiting to be installed. Tags never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'build' || 'test' }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  # The e2e scripts in parallel shards, each its own runner: run one after
  # another they took 32 min (11-14), the bus master's alone 11. Each shard
  # builds the daemon and runs the host tests itself, then its scripts; a
  # script failing doesn't stop the rest of its shard, so one run shows
  # every failure. A new e2e script goes into a shard here or it never runs.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: master
            scripts: master
          - shard: standby, PV, table
            scripts: standby pv table
          - shard: the rest
            scripts: e2e cca layout bridge multitap bus-log setup new-optimizer mesh mqtt-lookup login ingress https provision array handover shared-network resort dangerous-options
          - shard: system
            scripts: watchdog
            compose: true
    name: e2e (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tigod-dev -f linux/Dockerfile.dev linux
      - name: Build and run host tests
        run: docker run --rm -v "$PWD":/src -w /src tigod-dev linux/scripts/build.sh
      - name: End-to-end scripts
        run: |
          failed=""
          for n in ${{ matrix.scripts }}; do
            s="linux/scripts/$n-e2e.sh"; [ "$n" = e2e ] && s=linux/scripts/e2e.sh
            echo "::group::$s"
            start=$(date +%s)
            if docker run --rm -v "$PWD":/src -w /src tigod-dev "$s"; then r=ok; else r=FAILED; failed="$failed $n"; fi
            echo "::endgroup::"
            echo "$s: $r in $(( $(date +%s) - start )) s"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }
      - name: HTTPS in Docker Compose, with a stand-in for certbot
        if: matrix.compose
        run: |
          docker build -t tigomonitord:https-test -f linux/Dockerfile .
          linux/scripts/https-compose-test.sh

  # One check for "the tests passed", which the build jobs wait on; and a
  # guard that every e2e script is in a shard above.
  test:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every e2e script runs in a shard
        run: |
          missing=""
          for f in linux/scripts/*e2e.sh; do
            n="$(basename "$f" .sh)"; n="${n%-e2e}"
            grep -q "scripts: .*\b$n\b" .github/workflows/pi.yml || missing="$missing $n"
          done
          [ -z "$missing" ] || { echo "::error::e2e scripts in no shard:$missing"; exit 1; }

  deb:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        # Both for a tag, or a manual run that asks; else arm64 alone.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.arch != 'both' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"arm64","runner":"ubuntu-24.04-arm"},{"arch":"amd64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write  # attaching the .deb to a tag's release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags
      - name: Version
        id: version
        # v2.1.0 → 2.1.0; v2.1.0-3-gabc1234 → 2.1.0+3.gabc1234
        run: echo "version=$(git describe --tags | sed -E 's/^v//; s/-([0-9]+)-g/+\1.g/')" >> "$GITHUB_OUTPUT"
      - run: docker build -t tigod-dev -f linux/Dockerfile.dev linux
      - name: Build the ${{ matrix.arch }} .deb
        run: docker run --rm -v "$PWD":/src -w /src tigod-dev linux/packaging/build-deb.sh "${{ steps.version.outputs.version }}"
      - name: The certbot hook it ships, in a clean install
        run: linux/scripts/cert-hook-test.sh build/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: tigomonitord-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: build/deb/*.deb
          compression-level: 0  # already compressed
          # Actions storage is 2 GB: a release's 90 days, main's 7, any
          # other branch's a day (each is downloaded within minutes).
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || github.ref == 'refs/heads/main' && 7 || 1 }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The release itself is written by hand (see the release process); this
        # only adds the files, and does nothing if there is no release yet.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/deb/*.deb --clobber
          else
            echo "No release for $GITHUB_REF_NAME yet; files are in the workflow artifact."
          fi

  # The container image, built natively per architecture. A manual run keeps
  # it as a `docker load` artifact; a version tag pushes it to GHCR and the
  # image job below joins the two into one multi-arch tag.
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        # Both for a tag, or a manual run that asks; else arm64 alone.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.arch != 'both' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"arm64","runner":"ubuntu-24.04-arm"},{"arch":"amd64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        # Image tags can't hold the "+" of a dev version: 2.1.0+3.gabc1234 → 2.1.0-3.gabc1234
        run: echo "version=$(git describe --tags | sed -E 's/^v//; s/-([0-9]+)-g/-\1.g/')" >> "$GITHUB_OUTPUT"
      - name: Build the ${{ matrix.arch }} image
        run: |
          docker build -f linux/Dockerfile --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t "ghcr.io/rar/tigomonitord:${{ steps.version.outputs.version }}-${{ matrix.arch }}" .
      - name: Save it for a manual run
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: docker save "ghcr.io/rar/tigomonitord:${{ steps.version.outputs.version }}-${{ matrix.arch }}" | gzip > tigomonitord-image-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: tigomonitord-image-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: tigomonitord-image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          # ~30 MB each, most of the storage: main's kept 7 days, any other
          # branch's a day. A release's goes to GHCR instead.
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}
      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/rar/tigomonitord:${{ steps.version.outputs.version }}-${{ matrix.arch }}"

  image-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Join the architectures under one tag, and latest
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$v" latest; do
            docker buildx imagetools create -t "ghcr.io/rar/tigomonitord:$tag" \
              "ghcr.io/rar/tigomonitord:$v-arm64" "ghcr.io/rar/tigomonitord:$v-amd64"
          done
