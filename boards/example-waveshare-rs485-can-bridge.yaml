# Tigo bus network bridge on a Waveshare ESP32-S3-RS485-CAN
#
# This board does no decoding. It forwards the raw RS485 bus over TCP to
# tigomonitord (the Raspberry Pi / Linux build, or the Home Assistant app)
# running somewhere else, which decodes it and serves the dashboard. Its 7-36V
# input and DIN-rail case let it share the Tigo cabinet's supply.
#
# In tigomonitord, under Settings -> Bus, choose "Network bridge (TCP)" and
# enter  tigo-bridge.local:6638  (or this board's IP: mDNS doesn't reach every
# network, and the IP always works).
#
# ESPHome's own uart_tcp (built in from ESPHome 2026.11) does the forwarding:
# every byte the UART receives goes to the connected client. It serves one
# client at a time, so while TigoMonitor is connected nothing else can read
# the bus here.
#
# READ-ONLY, IN HARDWARE. uart_tcp also writes whatever a client sends to
# the UART. To keep any of that off the roof bus, the UART below has no tx_pin,
# so there is nowhere for a write to go. tigomonitord never sends anything
# either; this covers any other program that connects to port 6638.
#
# The SP3485EN's DE and /RE are one net on GPIO21, and LOW means "receiver on,
# driver off". The switch below holds it low; without it the board hears
# nothing (issue #22), and with it the driver can't turn on. Keep that switch.
#
# Two gaps, both while GPIO21 floats (see esp32s3-waveshare-rs485-can.yaml):
# under a second at each boot, and ESPHome's safe mode, which never sets the
# switch up. The safe_mode: block covers the second. A 10 kOhm resistor from
# GPIO21 to GND closes the first.
#
# Built, not yet run on a bus. The pins are the ones the monitor config uses,
# which a user ran in issue #22.

esphome:
  name: tigo-bridge
  friendly_name: "Tigo Bridge"
  # uart_tcp, below, is built into ESPHome from 2026.11.
  min_version: 2026.11.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # The UART ISR from IRAM, so bytes are not dropped while flash is busy.
      CONFIG_UART_ISR_IN_IRAM: "y"
      CONFIG_LOG_DEFAULT_LEVEL_INFO: "y"

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  # Latency costs nothing here, but dropped Wi-Fi beacons stall the stream.
  power_save_mode: none
  ap:
    ssid: "Tigo-Bridge Fallback Hotspot"
    password: "12345678"

captive_portal:

logger:
  level: INFO

# For OTA updates and the sensors below; nothing on the bus goes through it.
api:
  # encryption:
  #   key: "YOUR_BASE64_KEY"

ota:
  - platform: esphome
    password: "YOUR_OTA_PASSWORD"

switch:
  - platform: gpio
    id: rs485_enable
    internal: true
    pin: GPIO21          # DE + /RE, low => receiver on and driver off
    restore_mode: ALWAYS_OFF
  - platform: restart
    name: "Tigo Bridge Restart"

# Safe mode sets up only Wi-Fi, OTA and the logger, so the switch above never
# runs and GPIO21 floats high: driver on, for the 5 minutes safe mode lasts.
safe_mode:
  on_safe_mode:
    - lambda: |-
        gpio_reset_pin(GPIO_NUM_21);
        gpio_set_direction(GPIO_NUM_21, GPIO_MODE_OUTPUT);
        gpio_set_level(GPIO_NUM_21, 0);
        ESP_LOGW("tigo_bridge", "Safe mode: GPIO21 held low, the RS485 driver is off");

uart:
  id: tigo_uart
  rx_pin: GPIO18         # no tx_pin: see the read-only note at the top
  baud_rate: 38400
  # Bytes wait here while the network is slow. With uart_tcp's own 1 KB that's
  # 6 KB; 38400 baud is ~3.8 kB/s, so it covers about a second and a half.
  rx_buffer_size: 5120

uart_tcp:
  - id: tigo_tcp
    uart_id: tigo_uart
    role: server
    port: 6638

binary_sensor:
  - platform: status
    name: "Tigo Bridge Status"
  - platform: uart_tcp
    uart_tcp_id: tigo_tcp
    connected:
      name: "Tigo Bridge Client Connected"

sensor:
  - platform: wifi_signal
    name: "Tigo Bridge WiFi Signal"
    update_interval: 60s
  - platform: uart_tcp
    uart_tcp_id: tigo_tcp
    disconnects:
      name: "Tigo Bridge Disconnects"
