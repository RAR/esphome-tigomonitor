# Tigo bus network bridge on a LilyGO T-CAN485
#
# This board does no decoding. It forwards the raw RS485 bus over TCP to
# tigomonitord (the Raspberry Pi / Linux build) running somewhere else, which
# decodes it and serves the dashboard. Pick it when the Tigo cabinet is far
# from where you want to run the monitor, or when you would rather keep an
# ESP32 at the cabinet and the history on a bigger machine.
#
# In tigomonitord, under Settings -> Bus, choose "Network bridge (TCP)" and
# enter  tigo-bridge.local:6638  (or this board's IP).
#
# ESPHome's own uart_tcp (built in from ESPHome 2026.11) does the forwarding:
# every byte the UART receives goes to the connected client. It serves one
# client at a time, so while TigoMonitor is connected nothing else can read
# the bus here.
#
# READ-ONLY, IN HARDWARE THIS TIME. uart_tcp also writes whatever a client
# sends to the UART. To keep any of that off the roof bus, the UART below has
# no tx_pin, so there is nowhere for a write to go. tigomonitord never sends
# anything either; this covers any other program that connects to port 6638.
#
# Removing tx_pin is only safe because GPIO22 (the transceiver's DI) is held
# HIGH by the switch below. The MAX13487E turns its driver ON when DI is LOW
# (see esp32-lilygo-t-can485.yaml), so a floating DI could drive your bus.
# Keep that switch. ESPHome's safe mode never runs it; the safe_mode: block
# holds GPIO22 high there.

esphome:
  name: tigo-bridge
  friendly_name: "Tigo Bridge"
  # uart_tcp, below, is built into ESPHome from 2026.11.
  min_version: 2026.11.0

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      # See esp32-lilygo-t-can485.yaml for why 3.0 and not 3.1.
      minimum_chip_revision: '3.0'
    sdkconfig_options:
      # The UART ISR from IRAM, so bytes are not dropped while flash is busy.
      CONFIG_UART_ISR_IN_IRAM: "y"
      CONFIG_LOG_DEFAULT_LEVEL_INFO: "y"

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  # Latency costs nothing here, but dropped Wi-Fi beacons stall the stream.
  power_save_mode: none
  ap:
    ssid: "Tigo-Bridge Fallback Hotspot"
    password: "12345678"

captive_portal:

logger:
  level: INFO

# For OTA updates and the sensors below; nothing on the bus goes through it.
api:
  # encryption:
  #   key: "YOUR_BASE64_KEY"

ota:
  - platform: esphome
    password: "YOUR_OTA_PASSWORD"

# --- RS485 front end: see esp32-lilygo-t-can485.yaml for each pin ------------
switch:
  - platform: gpio
    id: rs485_power_5v
    internal: true
    pin: GPIO16          # 5V boost for the transceiver
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: rs485_auto_direction
    internal: true
    pin: GPIO17          # /RE high => AutoDirection controls the receiver
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: rs485_chip_enable
    internal: true
    pin: GPIO19          # SHDN high => normal operation
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: rs485_driver_off
    internal: true
    pin: GPIO22          # DI high => the driver stays off (no tx_pin below)
    restore_mode: ALWAYS_ON
  - platform: restart
    name: "Tigo Bridge Restart"

# Safe mode (after 10 quick reboots) sets up only Wi-Fi, OTA and the logger, so
# the switch above never runs and GPIO22 floats. This holds it high there too.
safe_mode:
  on_safe_mode:
    - lambda: |-
        gpio_reset_pin(GPIO_NUM_22);
        gpio_set_direction(GPIO_NUM_22, GPIO_MODE_OUTPUT);
        gpio_set_level(GPIO_NUM_22, 1);
        ESP_LOGW("tigo_bridge", "Safe mode: GPIO22 held high, the RS485 driver is off");

uart:
  id: tigo_uart
  rx_pin: GPIO21         # no tx_pin: see the read-only note at the top
  baud_rate: 38400
  # Bytes wait here while the network is slow. With uart_tcp's own 1 KB that's
  # 6 KB; 38400 baud is ~3.8 kB/s, so it covers about a second and a half.
  rx_buffer_size: 5120

uart_tcp:
  - id: tigo_tcp
    uart_id: tigo_uart
    role: server
    port: 6638

binary_sensor:
  - platform: status
    name: "Tigo Bridge Status"
  - platform: uart_tcp
    uart_tcp_id: tigo_tcp
    connected:
      name: "Tigo Bridge Client Connected"

sensor:
  - platform: wifi_signal
    name: "Tigo Bridge WiFi Signal"
    update_interval: 60s
  - platform: uart_tcp
    uart_tcp_id: tigo_tcp
    disconnects:
      name: "Tigo Bridge Disconnects"
